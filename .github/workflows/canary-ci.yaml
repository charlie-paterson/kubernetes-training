name: Canary CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "canary-platform/**"
      - ".github/workflows/canary-ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "canary-platform/**"
      - ".github/workflows/canary-ci.yaml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: canary-platform/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/canary-demo:${{ github.sha }} \
            ./canary-platform/app

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/canary-demo:${{ github.sha }}
