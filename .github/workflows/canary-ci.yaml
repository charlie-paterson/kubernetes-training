name: Canary CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "canary-platform/**"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
    paths:
      - "canary-platform/**"
      - ".github/workflows/**"

  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Choose baseline or canary deployment"
        required: true
        type: choice
        options:
          - baseline
          - canary
        default: baseline

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: canary-platform/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Docker login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin
      - name: Build and push image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/canary-demo:${{ github.sha }} \
            ./canary-platform/app
          docker push \
            ghcr.io/${{ github.repository_owner }}/canary-demo:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy baseline
        if: inputs.deployment_mode == 'baseline'
        run: |
          helm upgrade --install progressive ./canary-platform/helm \
            --set image.tag=${{ github.sha }} \
            --set app.version=1.0.0 \
            --set app.release=stable \
            --set-json 'strategy.canary.steps=[]'

      - name: Deploy canary
        if: inputs.deployment_mode == 'canary'
        run: |
          helm upgrade --install progressive ./canary-platform/helm \
            --set image.tag=${{ github.sha }} \
            --set app.version=2.0.0 \
            --set app.release=canary