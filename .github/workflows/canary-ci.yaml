name: Canary CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: canary-platform/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: canary-platform/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
