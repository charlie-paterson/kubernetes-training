name: ConfigMaps and Secrets training

on:
  push:
    branches:
      - main
    paths:
      - "config-secrets/**"
      - ".github/workflows/config-secrets-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test app syntax
        run: node --check config-secrets/app/server.js

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/config-secrets-demo:${{ github.sha }} \
            ./config-secrets/app
          docker push \
            ghcr.io/${{ github.repository_owner }}/config-secrets-demo:${{ github.sha }}

      - name: Create Kubernetes Secret
        run: |
          kubectl create secret generic config-demo-secret \
            --from-literal=API_TOKEN="${{ secrets.CONFIG_DEMO_API_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy ConfigMap and application
        run: |
          kubectl apply -f config-secrets/k8s/configmap.yaml
          helm upgrade --install config-secrets-demo ./config-secrets/helm \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/config-secrets-demo \
            --set image.tag=${{ github.sha }}