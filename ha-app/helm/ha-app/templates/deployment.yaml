apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ha-app.fullname" . }}
  labels:
    {{- include "ha-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      {{- include "ha-app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "ha-app.selectorLabels" . | nindent 8 }}

    spec:
      
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: APP_VERSION
              value: {{ .Values.app.version | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: app-data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: {{ include "ha-app.fullname" . }}
      {{- end }}
