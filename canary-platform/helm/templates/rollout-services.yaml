apiVersion: v1
kind: Service
metadata:
  name: {{ include "canary-app.fullname" . }}-stable
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "canary-app.fullname" . }}-canary
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP