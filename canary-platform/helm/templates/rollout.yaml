apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: {{ include "canary-app.fullname" . }}

spec:
  replicas: 3

  selector:
    matchLabels:
      {{- include "canary-app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "canary-app.selectorLabels" . | nindent 8 }}

    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}

      containers:
        - name: canary-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: APP_VERSION
              value: {{ .Values.app.version | quote }}

            - name: RELEASE
              value: {{ .Values.app.release | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

  strategy:
    canary:
      stableService: {{ include "canary-app.fullname" . }}-stable
      canaryService: {{ include "canary-app.fullname" . }}-canary

      trafficRouting:
        nginx:
          stableIngress: canary-app-ingress

      steps:
        - setWeight: 10
        - pause: {}
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: {}
        - setWeight: 75
        - pause: {}
        - setWeight: 100