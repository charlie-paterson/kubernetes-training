apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canary-app.fullname" . }}
  labels:
    {{- include "canary-app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "canary-app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "canary-app.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: canary-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 3000

          env:
            - name: APP_VERSION
              value: {{ .Values.app.version | quote }}

            - name: RELEASE
              value: {{ .Values.app.release | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
